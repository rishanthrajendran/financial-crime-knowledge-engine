# =============================================================================
# Financial Crime Knowledge Engine - CI/CD Pipeline
# =============================================================================
# Phase 0: Foundation validation
#
# Jobs:
#   1. lint - Code style checks (ESLint + Ruff) [MANDATORY]
#   2. type-check - Type safety (TypeScript + mypy) [MANDATORY]
#   3. test-backend - Python tests (pytest) with PostgreSQL [MANDATORY]
#   4. test-frontend - JavaScript/TypeScript tests (vitest) [MANDATORY]
#   5. security - Dependency audit and secrets scan [MANDATORY]
#   6. docker - Docker Compose verification [MANDATORY]
#   7. build - Next.js build verification [MANDATORY]
#
# CRITICAL: All mandatory jobs must fail on failure.
# Do NOT use || echo patterns to swallow failures.
# Informational checks must be explicitly documented as such.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '9'

jobs:
  # ===========================================================================
  # Job 1: Linting
  # ===========================================================================
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (Frontend)
        run: pnpm --filter @fcke/web lint
        # MANDATORY: ESLint failures will fail this step and job

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff (Backend)
        working-directory: apps/api
        run: ruff check .
        # MANDATORY: Ruff failures will fail this step and job

      - name: Run Ruff on Worker
        working-directory: apps/worker
        run: ruff check .
        # MANDATORY: Ruff failures will fail this step and job

  # ===========================================================================
  # Job 2: Type Checking
  # ===========================================================================
  type-check:
    name: 📝 Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check (Frontend)
        run: pnpm --filter @fcke/web type-check
        # MANDATORY: Type check failures will fail this step and job

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: pip install mypy

      - name: mypy type check (API)
        working-directory: apps/api
        run: mypy app
        # MANDATORY: mypy failures will fail this step and job

  # ===========================================================================
  # Job 3: Backend Tests
  # ===========================================================================
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fcke
          POSTGRES_PASSWORD: fcke_test
          POSTGRES_DB: fcke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fcke -d fcke_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://fcke:fcke_test@localhost:5432/fcke_test
      TEST_MODE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U fcke -d fcke_test && break || {
              if [ $i -eq 30 ]; then
                echo "::error::PostgreSQL did not become ready in time"
                exit 1
              fi
              sleep 2
            }
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/pyproject.toml

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx alembic

      - name: Run Alembic migrations
        working-directory: apps/api
        run: |
          source venv/bin/activate
          export PYTHONPATH=.
          alembic -c ../../alembic.ini -x sqlalchemy.url=$DATABASE_URL upgrade head
          echo "Alembic migrations completed successfully"
        env:
          DATABASE_URL: postgresql+asyncpg://fcke:fcke_test@localhost:5432/fcke_test

      - name: Verify database tables exist
        run: |
          PGPASSWORD=fcke_test psql -h localhost -U fcke -d fcke_test -c "\dt" | grep -E "knowledge_sources|knowledge_documents|audit_events" && echo "Expected tables verified" || { echo "::error::Expected tables not found after migration"; exit 1; }

      - name: Run backend tests
        working-directory: apps/api
        run: |
          source venv/bin/activate
          cd ../../
          python -m pytest tests/backend/ -v --tb=short
        # MANDATORY: Test failures will fail this step and job

      - name: Verify database connectivity
        working-directory: apps/api
        run: |
          source venv/bin/activate
          PGPASSWORD=fcke_test psql -h localhost -U fcke -d fcke_test -c "SELECT 1 as db_connected;"
        # MANDATORY: Connection failures will fail this step and job

  # ===========================================================================
  # Job 4: Frontend Tests
  # ===========================================================================
  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter @fcke/web test
        # MANDATORY: Test failures will fail this step and job

  # ===========================================================================
  # Job 5: Security Audit
  # ===========================================================================
  security:
    name: 🔒 Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        # MANDATORY: High/critical vulnerabilities will fail this step
        # Note: moderate/low are informational; high/critical cause non-zero exit

      - name: Check for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: --only-verified
        # MANDATORY: Verified secrets will fail this step and job
        # For push events: scans from previous commit to current
        # For PR events: scans from base branch to PR head
        # For first push (no before): falls back to full history scan

      - name: Run Phase 0 validation script
        run: python scripts/validate_phase0.py
        # MANDATORY: Validation failures will fail this step and job

  # ===========================================================================
  # Job 6: Docker Compose Verification
  # ===========================================================================
  docker:
    name: 🐳 Docker Compose Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose config

      - name: Build all services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 30
          docker compose ps

      - name: Check service logs
        run: docker compose logs --tail=50

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  # ===========================================================================
  # Job 7: Build Verification
  # ===========================================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm --filter @fcke/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "apps/web/.next" ]; then
            echo "::error::Next.js build output not found"
            exit 1
          fi
          echo "Build successful - output directory exists"
